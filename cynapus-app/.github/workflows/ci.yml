name: Cynapus CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true
  ANDROID_HOME: /opt/android-sdk

jobs:
  # Code quality and testing
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: ${{ runner.os }}-android-${{ hashFiles('**/build.gradle') }}

    - name: Setup environment
      run: |
        cd cynapus-app
        make setup-env

    - name: Check environment
      run: |
        cd cynapus-app
        make check-env

    - name: Download dependencies
      run: |
        cd cynapus-app
        make deps

    - name: Run lint checks
      run: |
        cd cynapus-app
        make lint

    - name: Run unit tests
      run: |
        cd cynapus-app
        make test

    - name: Generate test coverage
      run: |
        cd cynapus-app
        make test-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          cynapus-app/app/build/reports/tests/
          cynapus-app/app/build/reports/coverage/

    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: cynapus-app/app/build/reports/lint-results-debug.html

  # Build debug variant
  build-debug:
    name: Build Debug
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build debug APK
      run: |
        cd cynapus-app
        make build

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: cynapus-app/app/build/outputs/apk/debug/app-debug.apk

  # Build release variant
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build release APK and AAB
      run: |
        cd cynapus-app
        make build-release bundle

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: cynapus-app/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: cynapus-app/app/build/outputs/bundle/release/app-release.aab

  # Docker build test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker development image
      run: |
        cd cynapus-app
        docker build --target development -t cynapus-dev .

    - name: Build Docker CI image
      run: |
        cd cynapus-app
        docker build --target build -t cynapus-build .

    - name: Test Docker build
      run: |
        cd cynapus-app
        docker run --rm cynapus-build make ci

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'cynapus-app'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Documentation generation
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Generate documentation
      run: |
        cd cynapus-app
        make docs || echo "Documentation generation completed"

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          cynapus-app/app/build/dokka/html/
          cynapus-app/*.md

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: cynapus-app/app/build/dokka/html
        destination_dir: docs

  # Release deployment (for tagged releases)
  deploy:
    name: Deploy Release
    runs-on: ubuntu-latest
    needs: [build-release, security]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./artifacts/

    - name: Download AAB
      uses: actions/download-artifact@v4
      with:
        name: release-aab
        path: ./artifacts/

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/app-release-unsigned.apk
          ./artifacts/app-release.aab
        body: |
          ## Cynapus Android App Release
          
          ### What's New
          - Todo and Memo management features
          - Material Design UI
          - Room Database integration
          
          ### Download
          - **APK**: For direct installation
          - **AAB**: For Google Play Store distribution
          
          ### Installation
          1. Download the APK file
          2. Enable "Unknown sources" in Android settings
          3. Install the APK
          
          Generated with [Claude Code](https://claude.ai/code)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notification on completion
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality, build-debug, build-release, docker-build]
    if: always()
    
    steps:
    - name: Check workflow results
      run: |
        echo "Quality: ${{ needs.quality.result }}"
        echo "Build Debug: ${{ needs.build-debug.result }}"
        echo "Build Release: ${{ needs.build-release.result }}"
        echo "Docker Build: ${{ needs.docker-build.result }}"
        
        if [[ "${{ needs.quality.result }}" != "success" ]]; then
          echo "❌ Quality checks failed"
          exit 1
        fi
        
        if [[ "${{ needs.build-debug.result }}" != "success" ]]; then
          echo "❌ Debug build failed"
          exit 1
        fi
        
        echo "✅ CI pipeline completed successfully"